<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-blue-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-blue-600 mb-6">Create an Account</h2>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" value="{{ form.username.value|default:'' }}" required maxlength="150" class="w-full p-2 mb-3 border rounded">
            {% for error in form.username.errors %}<p class="text-red-500 text-sm -mt-2 mb-3">{{ error }}</p>{% endfor %}
            <input type="email" name="email" placeholder="Email" value="{{ form.email.value|default:'' }}" required class="w-full p-2 mb-3 border rounded">
            {% for error in form.email.errors %}<p class="text-red-500 text-sm -mt-2 mb-3">{{ error }}</p>{% endfor %}
            <input type="password" name="password" placeholder="Password" required class="w-full p-2 mb-3 border rounded">
            {% for error in form.password.errors %}<p class="text-red-500 text-sm -mt-2 mb-3">{{ error }}</p>{% endfor %}
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Sign Up</button>
        </form>
        <p class="text-center mt-4 text-sm">Already have an account? <a href="{% url 'login' %}" class="text-blue-600">Log in</a></p>
    </div>
</body>
</html>
