<!-- templates/store/cart.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #e3f2fd;
        }
        .header {
            background-color: #2196f3;
            color: white;
            padding: 1rem;
            text-align: center;
            border-radius: 0 0 20px 20px;
        }
    </style>
</head>
<body>
<div class="header">
    <h2>My Cart</h2>
</div>
<div class="container my-4">
    <a href="{% url 'buyer_dashboard' %}" class="btn btn-secondary mb-3">← Back to Dashboard</a>
    {% include 'store/_messages.html' %}
    <div class="row">
        {% for item in cart_items %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    {% if item.product.image %}
                        <img src="{{ item.product.image.url }}" alt="{{ item.product.name }}" class="card-img-top" style="height: 250px; object-fit: cover;">
                    {% endif %}
                    <div class="card-body text-center">
                        <h5 class="card-title">{{ item.product.name }}</h5>
                        <p class="card-text">₹{{ item.product.price }}</p>
                        <a href="{% url 'place_order' item.product.id %}" class="btn btn-primary">Place Order</a>
                        <form method="post" action="{% url 'remove_from_cart' item.product.id %}" class="d-inline">
                            {% csrf_token %}<button type="submit" class="btn btn-outline-danger">Remove</button>
                        </form>
                    </div>
                </div>
            </div>
        {% empty %}
            <p class="text-center">Your cart is empty.</p>
        {% endfor %}
    </div>
</div>
</body>
</html>
