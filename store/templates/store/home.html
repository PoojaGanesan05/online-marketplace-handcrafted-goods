<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketplace Home</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 min-h-screen text-white">
    <div class="flex flex-col justify-center items-center h-screen text-center">
        <h1 class="text-5xl font-bold mb-4">Welcome to Online Marketplace</h1>
        <p class="text-lg mb-6">Where creativity meets customers.</p>
        <div class="space-x-4">
            {% if dashboard_url %}
                <a href="{{ dashboard_url }}" class="px-6 py-2 bg-white text-pink-500 font-bold rounded shadow hover:bg-pink-100">Go to Dashboard</a>
                <a href="{% url 'logout' %}" class="px-6 py-2 bg-white text-purple-500 font-bold rounded shadow hover:bg-purple-100">Log Out</a>
            {% else %}
                <a href="{% url 'signup' %}" class="px-6 py-2 bg-white text-pink-500 font-bold rounded shadow hover:bg-pink-100">Sign Up</a>
                <a href="{% url 'login' %}" class="px-6 py-2 bg-white text-purple-500 font-bold rounded shadow hover:bg-purple-100">Log In</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
