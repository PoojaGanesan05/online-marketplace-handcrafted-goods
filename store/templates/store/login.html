<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-green-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-green-600 mb-6">Welcome Back</h2>
        {% if messages %}
            {% for message in messages %}
                <div class="text-red-500 text-sm mb-3">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <input type="text" name="username" placeholder="Username" required class="w-full p-2 mb-3 border rounded">
            <input type="password" name="password" placeholder="Password" required class="w-full p-2 mb-3 border rounded">
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Login</button>
        </form>
        <p class="text-center mt-4 text-sm">New here? <a href="{% url 'signup' %}" class="text-green-600">Create an account</a></p>
    </div>
</body>
</html>
